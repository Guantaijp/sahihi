<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sahihi — Test Chat</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #ece5dd; display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 480px; height: 100vh; background: #f7f7f7;
    display: flex; flex-direction: column;
  }
  header {
    background: #075E54; color: white; padding: 16px; font-weight: 600;
  }
  header small { display: block; font-weight: 400; opacity: 0.85; font-size: 12px; margin-top: 2px; }
  #messages {
    flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .bubble {
    max-width: 85%; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap;
    font-size: 14px; line-height: 1.4;
  }
  .bot { background: white; align-self: flex-start; border-top-left-radius: 2px; }
  .bubble a { color: #075E54; overflow-wrap: anywhere; }
  .user { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 2px; }
  form {
    display: flex; gap: 8px; padding: 10px; background: #f0f0f0; border-top: 1px solid #ddd;
  }
  input {
    flex: 1; padding: 10px 12px; border-radius: 20px; border: 1px solid #ccc; font-size: 14px;
  }
  button {
    background: #075E54; color: white; border: none; border-radius: 20px; padding: 0 18px; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      Sahihi
      <small>Public Participation Notice Finder — test chat (not real WhatsApp)</small>
    </header>
    <div id="messages"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Type a message..." />
      <button type="submit">Send</button>
    </form>
  </div>

<script>
  const sessionId = "web-" + Math.random().toString(36).slice(2);
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");

  // WhatsApp-style formatting: *bold*, plus clickable links (WhatsApp does this
  // itself). Escape first, so notice text can never inject HTML into the page.
  function renderText(text) {
    const escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    return escaped
      .replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>")
      .replace(/https?:\/\/[^\s<]+/g, (url) => {
        // Don't swallow punctuation that ends the sentence, not the URL.
        const trailing = url.match(/[.,;:!?)]+$/);
        const href = trailing ? url.slice(0, -trailing[0].length) : url;
        return `<a href="${href}" target="_blank" rel="noopener noreferrer">${href}</a>${trailing ? trailing[0] : ""}`;
      });
  }

  function addBubble(text, who) {
    const div = document.createElement("div");
    div.className = "bubble " + who;
    div.innerHTML = renderText(text);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function send(message) {
    addBubble(message, "user");
    input.value = "";
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message }),
      });
      const data = await res.json();
      addBubble(data.reply || "(no reply)", "bot");
    } catch (err) {
      addBubble("Error reaching server — is it running?", "bot");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (message) send(message);
  });

  // Kick off the conversation on load.
  send("hi");
</script>
</body>
</html>
